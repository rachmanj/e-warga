<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>Tidak ada koneksi — e-Warga</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #0f766e 0%, #115e59 100%);
            color: #f0fdfa;
            padding: 1.5rem;
        }
        main {
            max-width: 22rem;
            text-align: center;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            margin: 0 0 0.75rem;
        }
        p {
            margin: 0 0 1.25rem;
            line-height: 1.5;
            opacity: 0.95;
        }
        button {
            background: #fff;
            color: #0f766e;
            border: none;
            border-radius: 0.5rem;
            padding: 0.65rem 1.25rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #ccfbf1; }
    </style>
</head>
<body>
    <main>
        <h1>Koneksi terputus</h1>
        <p>Perangkat Anda tidak terhubung ke internet. Periksa jaringan Wi‑Fi atau data seluler, lalu coba buka e-Warga lagi.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>
</html>
